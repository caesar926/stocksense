<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockSense — Sign In</title>
<link rel="stylesheet" href="stock.css">
<style>
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--green-light) 0%,var(--navy-light) 100%);}
  .auth-card{background:var(--surface);border-radius:20px;padding:32px 26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(13,36,67,.3);}
  .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;}
  .auth-logo img{width:40px;height:40px;}
  .auth-logo span{font-size:22px;font-weight:900;color:var(--navy);}
  .auth-tagline{text-align:center;font-size:12px;color:var(--text2);margin-bottom:24px;}
  .auth-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:22px;}
  .auth-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text3);}
  .auth-tab.active{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .auth-form{display:none;}
  .auth-form.active{display:block;}
  .auth-error{background:#fff5f5;border:1.5px solid rgba(230,57,70,.25);color:var(--red);font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:10px;margin-bottom:14px;display:none;}
  .auth-error.show{display:block;}
  .auth-submit{width:100%;margin-top:6px;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo-icon-transparent.png" alt="StockSense logo"/>
      <span>StockSense</span>
    </div>
    <div class="auth-tagline">Know What You Have. Know What You Need.</div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login-btn" onclick="switchAuthTab('login')">Log In</div>
      <div class="auth-tab" id="tab-signup-btn" onclick="switchAuthTab('signup')">Create Account</div>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- LOG IN FORM -->
    <div class="auth-form active" id="form-login">
      <label class="form-label">Email</label>
      <input class="form-input" id="login-email" type="email" placeholder="you@example.com"/>
      <label class="form-label">Password</label>
      <input class="form-input" id="login-password" type="password" placeholder="Your password"/>
      <button class="btn btn-primary auth-submit" id="login-btn" onclick="handleLogin()">Log In</button>
    </div>

    <!-- SIGN UP FORM -->
    <div class="auth-form" id="form-signup">
      <label class="form-label">Your Name</label>
      <input class="form-input" id="signup-name" placeholder="e.g. Emeka Obi"/>
      <label class="form-label">Shop Name</label>
      <input class="form-input" id="signup-shop" placeholder="e.g. Emeka's Shop"/>
      <label class="form-label">Email</label>
      <input class="form-input" id="signup-email" type="email" placeholder=""/>
      <label class="form-label">Password</label>
      <input class="form-input" id="signup-password" type="password" placeholder="At least 6 characters"/>
      <button class="btn btn-primary auth-submit" id="signup-btn" onclick="handleSignup()">Create Account</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
